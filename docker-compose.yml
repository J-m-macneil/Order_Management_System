services:
  back-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-back_order_management}"
      POSTGRES_USER: "${POSTGRES_USER:-back_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - back-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  back-api:
    build:
      context: .
      dockerfile: Order_Management_System.Server/Dockerfile
    image: back-api
    depends_on:
      back-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Jwt__Issuer: "${JWT_ISSUER:-Back}"
      Jwt__Audience: "${JWT_AUDIENCE:-Back.Client}"
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      AllowedHosts: "${APP_DOMAIN:-localhost}"
      Demo__ReadOnlyMode: "${DEMO_READ_ONLY_MODE:-true}"
      ConnectionStrings__DefaultConnection: "Host=back-db;Port=5432;Database=${POSTGRES_DB:-back_order_management};Username=${POSTGRES_USER:-back_app};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      DocumentStorage__LocalRootPath: "/app/documents"
      DataProtection__KeyPath: "/app/data-protection-keys"
      DataProtection__ApplicationName: "Back"
    volumes:
      - back-documents:/app/documents
      - back-data-protection-keys:/app/data-protection-keys
    restart: unless-stopped

  back-client:
    build:
      context: ./order_management_system.client
      dockerfile: Dockerfile
    image: back-client
    depends_on:
      - back-api
    environment:
      API_BASE_URL: "/api"
    restart: unless-stopped

  back-proxy:
    image: caddy:2-alpine
    depends_on:
      - back-client
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - back-caddy-data:/data
      - back-caddy-config:/config
    restart: unless-stopped

volumes:
  back-db-data:
  back-documents:
  back-data-protection-keys:
  back-caddy-data:
  back-caddy-config:
