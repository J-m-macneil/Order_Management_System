<div class="form-card">
  <div class="app-section-header--divided flex items-center justify-between gap-4 mb-5">
    <div>
      <h2 class="app-section-title">Contacts</h2>
      <p class="text-xs app-muted-text mt-1">{{ contacts.length }} total</p>
    </div>

    <button type="button"
            appDemoWrite
            (click)="addContact.emit()"
            class="app-primary-button px-4 py-2">
      <svg lucidePlus [size]="17" aria-hidden="true"></svg>
      <span>Add Contact</span>
    </button>
  </div>

  <div *ngIf="contacts.length === 0" class="app-empty-state">
    No contacts recorded.
  </div>

  <div *ngIf="contacts.length > 0" class="divide-y app-divider mb-6">
    <div *ngFor="let contact of contacts"
         class="py-4 first:pt-0 last:pb-0">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <p class="app-strong-text truncate">{{ contact.name }}</p>
            <span *ngIf="contact.isPrimary" class="app-badge app-badge--success">Primary</span>
          </div>
          <p class="text-xs app-muted-text mt-1">{{ contact.jobTitle || 'No job title' }}</p>
        </div>

        <div class="app-inline-actions shrink-0">
          <button type="button"
                  appDemoWrite
                  (click)="editContact.emit(contact)"
                  class="app-link-button text-xs">
            Edit
          </button>
          <button *ngIf="!contact.isPrimary"
                  type="button"
                  appDemoWrite
                  (click)="setPrimaryContact.emit(contact)"
                  class="app-success-link text-xs">
            Set Primary
          </button>
          <button type="button"
                  appDemoWrite
                  (click)="deleteContact.emit(contact)"
                  class="app-danger-link text-xs">
            Delete
          </button>
        </div>
      </div>

      <div class="mt-3 space-y-1 text-xs app-body-text">
        <p class="truncate">{{ contact.email }}</p>
        <p>{{ contact.phone || 'No phone recorded' }}</p>
      </div>
    </div>
  </div>

  <div *ngIf="isContactFormOpen" [formGroup]="contactForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t app-divider pt-6">
    <div>
      <label class="form-label">Name</label>
      <input type="text" formControlName="name" class="form-input" />
      <p *ngIf="validationMessage(contactForm.get('name'), 'Name') as message" class="mt-1 app-validation-message">{{ message }}</p>
    </div>

    <div>
      <label class="form-label">Job Title</label>
      <input type="text" formControlName="jobTitle" class="form-input" />
    </div>

    <div>
      <label class="form-label">Email</label>
      <input type="email" autocomplete="email" formControlName="email" class="form-input" />
      <p *ngIf="validationMessage(contactForm.get('email'), 'Email') as message" class="mt-1 app-validation-message">{{ message }}</p>
    </div>

    <div>
      <label class="form-label">Phone</label>
      <input type="tel" inputmode="tel" autocomplete="tel" formControlName="phone" class="form-input" />
      <p *ngIf="validationMessage(contactForm.get('phone'), 'Phone number') as message" class="mt-1 app-validation-message">{{ message }}</p>
    </div>

    <label class="app-checkbox-label">
      <input type="checkbox" formControlName="isPrimary" class="app-checkbox" />
      <span>Primary contact</span>
    </label>

    <div class="flex gap-2 sm:col-span-2">
      <button type="button"
              appDemoWrite
              (click)="saveContact.emit()"
              class="app-primary-button px-4 py-2">
        {{ editingContactId ? 'Update Contact' : 'Add Contact' }}
      </button>

      <button *ngIf="isContactFormOpen"
              type="button"
              (click)="cancelContact.emit()"
              class="app-secondary-button px-4 py-2">
        Cancel
      </button>
    </div>
  </div>
</div>
