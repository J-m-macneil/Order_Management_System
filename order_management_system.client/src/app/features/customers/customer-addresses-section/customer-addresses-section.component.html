<div class="form-card">
  <div class="flex items-center justify-between gap-4 mb-5">
    <div>
      <h2 class="app-section-title">Addresses</h2>
      <p class="text-xs app-muted-text mt-1">{{ addresses.length }} total</p>
    </div>

    <button type="button"
            (click)="addAddress.emit()"
            class="app-primary-button px-4 py-2">
      Add Address
    </button>
  </div>

  <div *ngIf="addresses.length === 0" class="empty-state">
    No addresses recorded.
  </div>

  <div *ngIf="addresses.length > 0" class="space-y-3 mb-6">
    <div *ngFor="let address of addresses"
         class="app-sub-card">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <p class="app-strong-text truncate">{{ address.siteName }}</p>
            <span *ngIf="address.addressId === billingAddressId" class="app-badge app-badge--success">Billing</span>
            <span *ngIf="address.addressId === defaultDeliveryAddressId" class="app-badge app-badge--info">Delivery</span>
          </div>
          <p class="text-xs app-muted-text mt-1">{{ address.addressType }}</p>
          <p class="mt-3 text-sm app-body-text">
            {{ address.line1 }}<span *ngIf="address.line2">, {{ address.line2 }}</span>, {{ address.city }}, {{ address.postcode }}
          </p>
          <p class="text-xs app-muted-text mt-1">
            {{ address.contactName || 'No site contact' }}<span *ngIf="address.contactPhone"> - {{ address.contactPhone }}</span>
          </p>
        </div>

        <div class="flex flex-wrap gap-2 shrink-0">
          <button type="button"
                  (click)="editAddress.emit(address)"
                  class="app-action-button px-3 py-1 text-xs">
            Edit
          </button>
          <button type="button"
                  (click)="setBillingAddress.emit(address)"
                  class="reference-action-button">
            Set Billing
          </button>
          <button type="button"
                  (click)="setDefaultDeliveryAddress.emit(address)"
                  class="reference-action-button delivery">
            Set Delivery
          </button>
          <button type="button"
                  (click)="deleteAddress.emit(address)"
                  class="app-danger-link text-xs">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isAddressFormOpen" [formGroup]="addressForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t app-divider pt-6">
    <div>
      <label class="form-label">Address Type</label>
      <select formControlName="addressType" class="form-input">
        <option value="" disabled>Select address type</option>
        <option value="Billing">Billing</option>
        <option value="DeliverySite">Delivery site</option>
        <option value="WarehousePartner">Warehouse partner</option>
      </select>
    </div>

    <div>
      <label class="form-label">Site Name</label>
      <input type="text" formControlName="siteName" class="form-input" />
    </div>

    <div class="sm:col-span-2">
      <label class="form-label">Address Line 1</label>
      <input type="text" formControlName="line1" class="form-input" />
    </div>

    <div class="sm:col-span-2">
      <label class="form-label">Address Line 2</label>
      <input type="text" formControlName="line2" class="form-input" />
    </div>

    <div>
      <label class="form-label">City</label>
      <input type="text" formControlName="city" class="form-input" />
    </div>

    <div>
      <label class="form-label">County</label>
      <input type="text" formControlName="county" class="form-input" />
    </div>

    <div>
      <label class="form-label">Postcode</label>
      <input type="text" formControlName="postcode" class="form-input" />
    </div>

    <div>
      <label class="form-label">Country</label>
      <input type="text" formControlName="country" class="form-input" />
    </div>

    <div>
      <label class="form-label">Contact Name</label>
      <input type="text" formControlName="contactName" class="form-input" />
    </div>

    <div>
      <label class="form-label">Contact Phone</label>
      <input type="text" formControlName="contactPhone" class="form-input" />
    </div>

    <div class="sm:col-span-2">
      <label class="form-label">Delivery Instructions</label>
      <textarea formControlName="deliveryInstructions" rows="3" class="form-input resize-none"></textarea>
    </div>

    <label class="flex items-center gap-2">
      <input type="checkbox" formControlName="isPrimary" class="app-checkbox" />
      <span class="text-sm app-body-text">Primary address</span>
    </label>

    <div class="sm:col-span-2 flex gap-2">
      <button type="button"
              (click)="saveAddress.emit()"
              [disabled]="isLoading"
              class="app-primary-button px-4 py-2 disabled:opacity-60">
        {{ editingAddressId ? 'Save Address' : 'Add Address' }}
      </button>

      <button type="button"
              (click)="cancelAddress.emit()"
              class="app-secondary-button px-4 py-2">
        Cancel
      </button>
    </div>
  </div>
</div>
