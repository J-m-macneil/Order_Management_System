<!-- Page Header -->
<div class="mb-8 flex items-center justify-between">
  <div>
    <h1 class="text-3xl font-light text-slate-900 dark:text-white">
      {{ isEditMode ? 'Edit Customer' : 'Create Customer' }}
    </h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">
      {{ isEditMode ? 'Update customer details' : 'Create a new customer account' }}
    </p>
  </div>
  <a routerLink="/customers" class="text-blue-600 dark:text-blue-400 hover:underline">
    ← Back to Customers
  </a>
</div>

<!-- Loading -->
<div *ngIf="isLoading" class="text-center py-12">
  <p class="text-slate-500 dark:text-slate-400">Loading...</p>
</div>

<!-- Error -->
<div *ngIf="errorMessage && !isLoading"
     class="p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/50 rounded-lg mb-6">
  <p class="text-red-600 dark:text-red-400">{{ errorMessage }}</p>
</div>

<!-- Form -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 lg:grid-cols-3 gap-6">

  <!-- Main -->
  <div class="lg:col-span-2 space-y-6">

    <!-- Customer Details -->
    <div class="form-card">
      <h2 class="text-lg font-medium text-slate-900 dark:text-white mb-6">Customer Details</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div>
          <label class="form-label">Account Number</label>
          <input type="text" formControlName="accountNumber" class="form-input" />
        </div>

        <div>
          <label class="form-label">Company Name</label>
          <input type="text" formControlName="companyName" class="form-input" />
        </div>

        <div>
          <label class="form-label">Industry</label>
          <input type="text" formControlName="industryType" class="form-input" />
        </div>

        <div>
          <label class="form-label">Payment Terms (Days)</label>
          <input type="number" formControlName="paymentTermsDays" class="form-input" />
        </div>

        <div>
          <label class="form-label">Credit Limit</label>
          <input type="number" step="0.01" formControlName="creditLimit" class="form-input" />
        </div>

      </div>
    </div>

    <!-- Contact Info -->
    <div class="form-card">
      <h2 class="text-lg font-medium text-slate-900 dark:text-white mb-6">Main Contact</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div>
          <label class="form-label">Name</label>
          <input type="text" formControlName="mainContactName" class="form-input" />
        </div>

        <div>
          <label class="form-label">Email</label>
          <input type="email" formControlName="mainContactEmail" class="form-input" />
        </div>

        <div>
          <label class="form-label">Phone</label>
          <input type="text" formControlName="mainContactPhone" class="form-input" />
        </div>

      </div>
    </div>

  </div>

  <!-- Sidebar -->
  <div class="space-y-6">

    <!-- Status -->
    <div class="form-card">
      <h2 class="text-lg font-medium text-slate-900 dark:text-white mb-6">Status</h2>

      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="isActive" class="w-4 h-4 accent-blue-600" />
        <span class="text-sm text-slate-700 dark:text-slate-300">Active Customer</span>
      </label>
    </div>

    <!-- Actions -->
    <div class="form-card">
      <button type="submit"
              [disabled]="isLoading"
              class="w-full px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors">
        {{ isEditMode ? 'Update Customer' : 'Create Customer' }}
      </button>

      <a routerLink="/customers"
         class="block mt-3 text-center px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600">
        Cancel
      </a>
    </div>

  </div>
</form>
