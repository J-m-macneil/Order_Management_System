<div class="detail-card">
  <h2 class="app-section-title mb-6">Summary</h2>
  <div class="space-y-3">
    <div class="flex justify-between items-center pb-3 border-b app-divider">
      <span class="app-muted-text">Subtotal</span>
      <span class="app-strong-text">{{ order.subtotal | currency: order.currency }}</span>
    </div>
    <div class="flex justify-between items-center pb-3 border-b app-divider">
      <span class="app-muted-text">Discount</span>
      <span class="app-strong-text">-{{ order.discountAmount | currency: order.currency }}</span>
    </div>
    <div class="flex justify-between items-center pb-3 border-b app-divider">
      <span class="app-muted-text">Tax</span>
      <span class="app-strong-text">{{ order.taxAmount | currency: order.currency }}</span>
    </div>
    <div class="flex justify-between items-center pt-3">
      <span class="text-lg app-strong-text">Total</span>
      <span class="text-2xl font-light app-accent-text">{{ order.totalAmount | currency: order.currency }}</span>
    </div>
  </div>
</div>
