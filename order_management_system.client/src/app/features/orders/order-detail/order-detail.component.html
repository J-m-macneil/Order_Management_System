<!-- Loading State -->
<div *ngIf="isLoading" class="app-empty-state">
  <p>Loading order details...</p>
</div>

<!-- Error State -->
<div *ngIf="errorMessage && !isLoading" class="p-4 app-alert app-alert--danger">
  <p class="app-alert-text--danger">{{ errorMessage }}</p>
</div>

<!-- Order Detail Content -->
<div *ngIf="order as currentOrder" class="space-y-6">
  <!-- Page Header -->
  <div class="app-page-header">
    <div>
      <h1 class="brand-page-title order-detail-title">
        {{ currentOrder.orderNumber }}<span class="brand-page-dot" aria-hidden="true">.</span>
      </h1>
      <p class="app-muted-text mt-1">{{ currentOrder.customerName || 'Customer #' + currentOrder.customerId }}</p>
    </div>
    <a routerLink="/orders" class="app-tertiary-button app-back-link">
      &larr; Back to Orders
    </a>
  </div>

  <app-order-status-strip [order]="currentOrder"
                          [isDiscardingDraft]="isDiscardingDraft"
                          (discardDraft)="requestDiscardDraft()">
  </app-order-status-strip>

  <!-- Main Content Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Main Content (2 columns) -->
    <div class="lg:col-span-2 space-y-6">
      <app-order-information-card [order]="currentOrder"></app-order-information-card>
      <app-order-items-table [items]="currentOrder.items"
                             [currency]="currentOrder.currency"
                             class="block mt-6">
      </app-order-items-table>

      <app-order-notes-card [order]="currentOrder"></app-order-notes-card>
    </div>

    <!-- Sidebar (1 column) -->
    <div class="space-y-6">

      <app-order-status-actions [allowedStatuses]="allowedStatuses"
                                [currentStatusId]="currentOrder.orderStatusId"
                                [isChangingStatus]="isChangingStatus"
                                (statusChange)="requestStatusChange($event)">
      </app-order-status-actions>

      <app-order-summary-card [order]="currentOrder"></app-order-summary-card>

      <!-- Documents -->
      <div class="mt-6">
        <app-order-documents-panel [orderId]="currentOrder.orderId">
        </app-order-documents-panel>
      </div>

      <app-order-logistics-card [order]="currentOrder"></app-order-logistics-card>
      <app-order-activity-card [order]="currentOrder"></app-order-activity-card>
      <app-order-status-history [history]="history"></app-order-status-history>

      <!-- Processing Jobs -->
      <div class="mt-6">
        <app-processing-jobs-panel
          [orderId]="currentOrder.orderId"
          [orderStatusId]="currentOrder.orderStatusId">
        </app-processing-jobs-panel>
      </div>

    </div>
  </div>
</div>

<app-confirmation-modal *ngIf="confirmationModal.isOpen"
                        [title]="confirmationModal.title"
                        [message]="confirmationModal.message"
                        [confirmText]="confirmationModal.confirmText"
                        [variant]="confirmationModal.variant"
                        [requireReason]="confirmationModal.requireReason"
                        [reasonPlaceholder]="confirmationModal.reasonPlaceholder"
                        (confirm)="onConfirmationConfirm($event)"
                        (cancel)="onConfirmationCancel()">
</app-confirmation-modal>
