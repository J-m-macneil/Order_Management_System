<div class="detail-card">
  <h2 class="text-lg font-medium text-slate-900 dark:text-white mb-6">
    Documents
  </h2>

  <div *ngIf="errorMessage"
       class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/50 rounded-lg">
    <p class="text-sm text-red-600 dark:text-red-400">{{ errorMessage }}</p>
  </div>

  <p *ngIf="isLoading" class="text-slate-500 dark:text-slate-400 text-sm">
    Loading documents...
  </p>

  <div *ngIf="!isLoading && documents.length > 0; else noDocuments"
       class="space-y-4">

    <div *ngFor="let document of documents"
         class="border-l-2 border-slate-200 dark:border-slate-700 pl-4">

      <p class="text-sm font-medium text-slate-900 dark:text-white">
        {{ document.documentType }}
      </p>

      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 break-all">
        {{ document.fileName }}
      </p>

      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
        Created: {{ document.createdAt | date: 'MMM d, yyyy h:mm a' }}
      </p>

      <div class="flex gap-2 mt-3">
        <button type="button"
                (click)="viewDocument(document)"
                class="app-action-button px-3 py-2 text-sm">
          View
        </button>

        <button type="button"
                (click)="downloadDocument(document)"
                class="app-primary-button px-3 py-2 text-sm">
          Download
        </button>
      </div>
    </div>
  </div>

  <ng-template #noDocuments>
    <p *ngIf="!isLoading && !errorMessage"
       class="text-slate-500 dark:text-slate-400 text-sm">
      No documents found.
    </p>
  </ng-template>
</div>
