<div class="detail-card">
  <h2 class="app-section-title mb-6">
    Documents
  </h2>

  <div *ngIf="errorMessage"
       class="mb-4 p-3 app-alert app-alert--danger">
    <p class="text-sm app-alert-text--danger">{{ errorMessage }}</p>
  </div>

  <p *ngIf="isLoading" class="app-muted-text text-sm">
    Loading documents...
  </p>

  <div *ngIf="!isLoading && documents.length > 0; else noDocuments"
       class="space-y-4">

    <div *ngFor="let document of documents"
         class="border-l-2 app-divider pl-4">

      <p class="text-sm app-strong-text">
        {{ document.documentType }}
      </p>

      <p class="text-xs app-muted-text mt-1 break-all">
        {{ document.fileName }}
      </p>

      <p class="text-xs app-muted-text mt-1">
        Created: {{ document.createdAt | date:'dd MMM yyyy, HH:mm':'':'en-GB' }}
      </p>

      <div class="flex gap-2 mt-3">
        <a [href]="getDocumentViewUrl(document)"
           target="_blank"
           rel="noopener"
           class="app-secondary-button px-3 py-2 text-sm">
          View
        </a>

        <button type="button"
                (click)="downloadDocument(document)"
                class="app-primary-button px-3 py-2 text-sm">
          Download
        </button>
      </div>
    </div>
  </div>

  <ng-template #noDocuments>
    <p *ngIf="!isLoading && !errorMessage"
       class="app-muted-text text-sm">
      No documents found.
    </p>
  </ng-template>
</div>
