<div class="detail-card">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="space-y-3">
      <div class="flex flex-wrap gap-2">
        <span class="app-badge app-badge--info">
          {{ order.orderStatusName || 'Status ' + order.orderStatusId }}
        </span>
        <span *ngIf="order.isPriorityOrder" class="app-badge app-badge--warning">
          Priority Order
        </span>
      </div>
      <p class="text-sm app-body-text">{{ getEditLockMessage() }}</p>
    </div>
    <div *ngIf="canEditOrder()" class="flex flex-wrap gap-2">
      <a [routerLink]="['/orders', order.orderId, 'edit']"
         class="app-primary-button px-4 py-2">
        Edit
      </a>
      <button type="button"
              (click)="discardDraft.emit()"
              [disabled]="isDiscardingDraft"
              class="app-danger-button px-4 py-2">
        {{ isDiscardingDraft ? 'Discarding...' : 'Discard Draft' }}
      </button>
    </div>
  </div>
</div>
