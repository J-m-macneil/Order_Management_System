<div class="detail-card">
  <h2 class="app-section-title mb-6">Notes</h2>
  <div class="space-y-4">
    <div *ngIf="order.specialInstructions">
      <p class="form-label">Special Instructions</p>
      <p class="app-body-text mt-2">{{ order.specialInstructions }}</p>
    </div>
    <div *ngIf="order.internalNotes">
      <p class="form-label">Internal Notes</p>
      <p class="app-body-text mt-2">{{ order.internalNotes }}</p>
    </div>
    <div *ngIf="order.failureReason">
      <p class="text-xs uppercase tracking-wide app-alert-text--danger font-medium">Failure Reason</p>
      <p class="app-body-text mt-2">{{ order.failureReason }}</p>
    </div>
    <div *ngIf="!order.specialInstructions && !order.internalNotes && !order.failureReason">
      <p class="app-muted-text">No additional notes.</p>
    </div>
  </div>
</div>
