<!-- Page Header -->
<div class="mb-8 flex items-center justify-between">
  <div>
    <h1 class="text-3xl font-light text-slate-900 dark:text-white">Admin Panel</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-2">Manage users and system settings</p>
  </div>
  <button class="px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 transition-colors">
    + New User
  </button>
</div>

<!-- User Management Section -->
<div class="bg-white dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700/50 rounded-lg overflow-hidden">
  <div class="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-100 dark:border-slate-700 px-6 py-4">
    <h2 class="text-lg font-medium text-slate-900 dark:text-white">User Management</h2>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-100 dark:border-slate-700">
        <tr>

            User
          </th>
          <th class="text-left text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wide py-4 px-6">
            Email
          </th>
          <th class="text-left text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wide py-4 px-6">
            Role
          </th>
          <th class="text-center text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wide py-4 px-6">
            Status
          </th>
          <th class="text-center text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wide py-4 px-6">
            Actions
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-700">

            <div class="flex items-center gap-3">

                JD

              <div>
                <div class="text-slate-900 dark:text-white font-medium">John Doe</div>
                <div class="text-xs text-slate-500 dark:text-slate-400">johndoe</div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 text-slate-600 dark:text-slate-300">john&#64;example.com</td>
          <td class="px-6 py-4">
            <span class="inline-flex px-3 py-1 rounded-md bg-blue-100 dark:bg-blue-900/20 text-blue-700 dark:text-blue-400 text-xs font-medium">
              Sales
            </span>
          </td>
          <td class="px-6 py-4 text-center">
            <span class="inline-flex px-2 py-1 rounded-md bg-emerald-100 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 text-xs font-medium">
              Active
            </span>
          </td>
          <td class="px-6 py-4 text-center">
            <div class="flex items-center justify-center gap-2">
              <button class="text-blue-600 dark:text-blue-400 hover:underline text-xs font-medium">
                Edit
              </button>
              <button class="text-red-600 dark:text-red-400 hover:underline text-xs font-medium">
                Remove
              </button>
            </div>
          </td>
        </tr>

              <button class="text-red-600 dark:text-red-400 hover:underline text-xs font-medium">

          <td class="px-6 py-4">
            <span class="inline-flex px-3 py-1 rounded-md bg-red-100 dark:bg-red-900/20 text-red-700 dark:text-red-400 text-xs font-medium">
              Admin
            </span>
          </td>
          <td class="px-6 py-4 text-center">
            <span class="inline-flex px-2 py-1 rounded-md bg-emerald-100 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 text-xs font-medium">
              Active
            </span>
          </td>
          <td class="px-6 py-4 text-center">
            <div class="flex items-center justify-center gap-2">
              <button class="text-blue-600 dark:text-blue-400 hover:underline text-xs font-medium">

              <button class="text-red-600 dark:text-red-400 hover:underline text-xs font-medium">
