<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="app-card p-6 w-full max-w-md">

    <h2 class="app-section-title mb-4">
      {{ title }}
    </h2>

    <textarea [(ngModel)]="value"
              rows="4"
              class="form-input text-sm"
              [placeholder]="placeholder"></textarea>

    <div class="flex justify-end gap-2 mt-4">
      <button (click)="close()"
              class="app-secondary-button px-4 py-2 text-sm">
        Cancel
      </button>

      <button (click)="submit()"
              class="app-primary-button px-4 py-2 text-sm">
        Confirm
      </button>
    </div>

  </div>
</div>
