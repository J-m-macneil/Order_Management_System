<div class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 dark:from-slate-900 dark:to-slate-800 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo and Branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-3 mb-4">
        <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center text-white text-xl font-semibold">
          C
        </div>
        <div class="text-left">
          <div class="text-2xl font-medium text-slate-900 dark:text-white">ChemFlow</div>
          <div class="text-xs text-slate-500 dark:text-slate-400">Chemical OMS</div>
        </div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="bg-white dark:bg-slate-800 rounded-lg border border-slate-100 dark:border-slate-700/50 p-8 shadow-lg">
      <h1 class="text-2xl font-light text-slate-900 dark:text-white mb-2">Sign in</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Access your chemical order management system</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Username/Email Field -->
        <div>
          <label for="usernameOrEmail" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
            Username or email
          </label>
          <input
            id="usernameOrEmail"
            type="text"
            formControlName="usernameOrEmail"
            class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all"
            placeholder="username@example.com"
          />
          <div *ngIf="loginForm.get('usernameOrEmail')?.hasError('required') && loginForm.get('usernameOrEmail')?.touched" class="mt-1 text-sm text-red-500">
            Username or email is required
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">
            Password
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 transition-all"
            placeholder="••••••••"
          />
          <div *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched" class="mt-1 text-sm text-red-500">
            Password is required
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="mt-4 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/50 rounded-lg">
          <p class="text-sm text-red-600 dark:text-red-400">{{ errorMessage }}</p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full mt-6 px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          {{ isLoading ? '🔄 Signing in...' : 'Sign in' }}
        </button>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
      Protected with industry-standard security
    </p>
  </div>
</div>
