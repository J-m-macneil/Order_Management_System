<div class="login-page">
  <mat-card class="login-card">
    <h1>Sign in</h1>
    <p class="subtitle">Chemical Order Management System</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username or email</mat-label>
        <input matInput formControlName="usernameOrEmail" />
        <mat-error *ngIf="loginForm.get('usernameOrEmail')?.hasError('required')">
          Username or email is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
      </mat-form-field>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </mat-card>
</div>
