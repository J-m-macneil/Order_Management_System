<div class="login-page min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="login-card app-card p-8">
      <div class="text-center mb-6">
        <img
          class="login-logo"
          [src]="themeService.isDarkMode() ? 'login-logo-dark.svg' : 'login-logo-light.svg'"
          alt="Back" />
        <p class="text-xs app-muted-text mt-3">Order Management System</p>
      </div>

      <div class="mb-6">
        <h1 class="text-2xl app-strong-text">Sign in</h1>
        <p class="text-sm app-muted-text mt-1">Access your order management system</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="usernameOrEmail" class="form-label">Username or email</label>
          <input
            id="usernameOrEmail"
            type="text"
            formControlName="usernameOrEmail"
            class="form-input"
            placeholder="username@example.com"
            autocomplete="username" />

          <p *ngIf="validationMessage(loginForm.get('usernameOrEmail'), 'Username or email') as message"
             class="mt-1 app-validation-message">
            {{ message }}
          </p>
        </div>

        <div>
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="form-input"
            placeholder="Enter your password"
            autocomplete="current-password" />

          <p *ngIf="validationMessage(loginForm.get('password'), 'Password') as message"
             class="mt-1 app-validation-message">
            {{ message }}
          </p>
        </div>

        <p *ngIf="errorMessage" class="text-sm app-alert-text--danger" role="alert">
          {{ errorMessage }}
        </p>

        <button
          type="submit"
          [disabled]="isLoading"
          class="app-primary-button w-full mt-6 px-4 py-2.5">
          {{ isLoading ? 'Signing in...' : 'Sign in' }}
        </button>

        <button type="button"
                [disabled]="isLoading"
                (click)="loginDemo()"
                class="app-secondary-button w-full px-4 py-2.5">
          Explore Demo
        </button>
      </form>

      <p class="text-center text-xs app-muted-text mt-6">
        Demo access is read-only
      </p>
    </div>
  </div>
</div>
