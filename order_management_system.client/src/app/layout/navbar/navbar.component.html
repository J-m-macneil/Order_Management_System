<header class="sticky top-0 z-50 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700/50">
  <nav class="h-16 px-8 flex items-center justify-between max-w-[1400px] mx-auto">
    <!-- Left: Logo and Brand -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white text-lg font-semibold">
        C
      </div>
      <div>
        <div class="text-lg font-medium text-slate-900 dark:text-white">ChemFlow</div>
        <div class="text-xs text-slate-500 dark:text-slate-400 leading-none">Chemical OMS</div>
      </div>
    </div>

    <!-- Center: Navigation Tabs -->
    <div class="hidden md:flex items-center gap-1">
      <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-tab">
        <span>Dashboard</span>
      </a>
      <a routerLink="/orders" routerLinkActive="nav-active" class="nav-tab">
        <span>Orders</span>
      </a>
      <a routerLink="/customers" routerLinkActive="nav-active" class="nav-tab">
        <span>Customers</span>
      </a>
      <a routerLink="/products" routerLinkActive="nav-active" class="nav-tab">
        <span>Products</span>
      </a>
      <a routerLink="/admin" routerLinkActive="nav-active" class="nav-tab">
        <span>Admin</span>
      </a>
    </div>

    <!-- Right: Dark Mode Toggle and Role Selector -->
    <div class="flex items-center gap-4">
      <!-- Dark Mode Toggle -->
      <button
        (click)="toggleDarkMode()"
        class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700/50 rounded-lg transition-colors"
        [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <span *ngIf="!isDarkMode()" class="text-xl">🌙</span>
        <span *ngIf="isDarkMode()" class="text-xl">☀️</span>
      </button>

      <!-- Role Selector Dropdown -->
      <div class="relative group">
        <button
          class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors"
        >
          <div
            class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-medium"
          >
            {{ getUserInitials() }}
          </div>
          <div class="hidden sm:block text-left">
            <div class="text-xs font-medium text-slate-900 dark:text-white">{{ currentRole() | uppercase }}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">{{ userName() }}</div>
          </div>
        </button>

        <!-- Role Dropdown Menu -->
        <div
          class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/50 rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200"
        >
          <div class="p-2">
            <div class="text-xs font-semibold text-slate-500 dark:text-slate-400 px-3 py-2">SWITCH ROLE</div>
            <button
              *ngFor="let role of roles"
              (click)="switchRole(role)"
              class="w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors text-sm"
              [class.bg-blue-100]="currentRole() === role"
              [class.dark:bg-blue-900/20]="currentRole() === role"
              [class.text-blue-600]="currentRole() === role"
              [class.dark:text-blue-400]="currentRole() === role"
            >
              <span>{{ roleLabels[role] }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
