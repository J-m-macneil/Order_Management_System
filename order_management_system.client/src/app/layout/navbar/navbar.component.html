<header class="sticky top-0 z-50 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700/50">
  <nav class="h-16 px-8 flex items-center justify-between max-w-[1400px] mx-auto">

    <!-- Left: Logo and Brand -->
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white text-lg font-semibold">
        C
      </div>
      <div>
        <div class="text-lg font-medium text-slate-900 dark:text-white">ChemFlow</div>
        <div class="text-xs text-slate-500 dark:text-slate-400 leading-none">Chemical OMS</div>
      </div>
    </div>

    <!-- Center: Navigation Tabs -->
    <div class="hidden md:flex items-center gap-1">

      <!-- Dashboard -->
      <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-tab">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
        </svg>
        <span>Dashboard</span>
      </a>

      <!-- Orders -->
      <a routerLink="/orders" routerLinkActive="nav-active" class="nav-tab">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7.35304L21 16.647C21 16.8649 20.8819 17.0656 20.6914 17.1715L12.2914 21.8381C12.1102 21.9388 11.8898 21.9388 11.7086 21.8381L3.30861 17.1715C3.11814 17.0656 3 16.8649 3 16.647L2.99998 7.35304C2.99998 7.13514 3.11812 6.93437 3.3086 6.82855L11.7086 2.16188C11.8898 2.06121 12.1102 2.06121 12.2914 2.16188L20.6914 6.82855C20.8818 6.93437 21 7.13514 21 7.35304Z" />
          <path d="M3.52844 7.29357L11.7086 11.8381C11.8898 11.9388 12.1102 11.9388 12.2914 11.8381L20.5 7.27777" />
          <path d="M12 21L12 12" />
        </svg>
        <span>Orders</span>
      </a>

      <!-- Customers -->
      <a routerLink="/customers" routerLinkActive="nav-active" class="nav-tab">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 7a4 4 0 1 0 8 0" />
          <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
        </svg>
        <span>Customers</span>
      </a>

      <!-- Products -->
      <a routerLink="/products" routerLinkActive="nav-active" class="nav-tab">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.75h4.5M10.5 3.75v4.5L5.8 17.1A2.25 2.25 0 0 0 7.78 20.4h8.44a2.25 2.25 0 0 0 1.98-3.3l-4.7-8.85v-4.5" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15.75h7.5" />
        </svg>
        <span>Products</span>
      </a>

      <!-- Admin -->
      <a routerLink="/admin" routerLinkActive="nav-active" class="nav-tab">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.6 3.75h4.8l.6 2.1a7.5 7.5 0 0 1 1.55.9l2.1-.55 2.4 4.15-1.55 1.55c.05.36.08.73.08 1.1s-.03.74-.08 1.1l1.55 1.55-2.4 4.15-2.1-.55a7.5 7.5 0 0 1-1.55.9l-.6 2.1H9.6l-.6-2.1a7.5 7.5 0 0 1-1.55-.9l-2.1.55-2.4-4.15 1.55-1.55A7.87 7.87 0 0 1 4.42 13c0-.37.03-.74.08-1.1L2.95 10.35l2.4-4.15 2.1.55A7.5 7.5 0 0 1 9 5.85l.6-2.1Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15.75A2.75 2.75 0 1 0 12 10.25a2.75 2.75 0 0 0 0 5.5Z" />
        </svg>
        <span>Admin</span>
      </a>

    </div>

    <!-- Right: Controls -->
    <div class="flex items-center gap-2">

      <!-- Dark Mode Toggle -->
      <button type="button"
              (click)="toggleDarkMode()"
              class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700/50 rounded-lg transition-colors flex items-center justify-center text-slate-700 dark:text-white"
              [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">

        <!-- Moon -->
        <svg *ngIf="!themeService.isDarkMode()" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454" />
        </svg>

        <!-- Sun -->
        <svg *ngIf="themeService.isDarkMode()" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.828 14.828a4 4 0 1 0 -5.656 -5.656a4 4 0 0 0 5.656 5.656" />
          <path d="M6.343 17.657l-1.414 1.414" />
          <path d="M6.343 6.343l-1.414 -1.414" />
          <path d="M17.657 6.343l1.414 -1.414" />
          <path d="M17.657 17.657l1.414 1.414" />
          <path d="M4 12h-2" />
          <path d="M12 4v-2" />
          <path d="M20 12h2" />
          <path d="M12 20v2" />
        </svg>

      </button>

      <!-- Separator -->
      <div class="h-6 w-px bg-slate-200 dark:bg-slate-600"></div>

      <!-- User Role Display -->
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-medium">
          {{ getUserInitials() }}
        </div>

        <div class="hidden sm:block text-left">
          <div class="text-xs font-medium text-slate-900 dark:text-white">
            {{ currentRole() }}
          </div>
          <div class="text-xs text-slate-500 dark:text-slate-400">
            {{ userName() }}
          </div>
        </div>
      </div>

    </div>

  </nav>
</header>
